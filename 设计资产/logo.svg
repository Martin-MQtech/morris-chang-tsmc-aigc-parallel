<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Deep Solid Black Circular Emblem -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="#333333" stroke-width="2" />
  
  <!-- Minimalist Inner Framing Circle -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#222222" stroke-width="1" />

  <!-- Bold, Razor-Sharp Pure White Geometric "MC" Monogram -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Geometric M -->
    <path d="M 23 72 L 23 28 L 39 51 L 55 28 L 55 72" />
    <!-- Concentric Clean C -->
    <path d="M 76 34 A 20 20 0 1 0 76 66" />
  </g>

  <!-- Accent Precision Node (Gold micro-dot symbolizing Silicon / Semiconductor Focus) -->
  <circle cx="39" cy="51" r="2.5" fill="#F59E0B" />
</svg>
