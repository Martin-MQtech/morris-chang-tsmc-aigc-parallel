<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pure Black Flat Disc Background -->
  <circle cx="50" cy="50" r="48" fill="#050505" stroke="#333333" stroke-width="1.5" />
  
  <!-- Subtle Precision Architectural Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#222222" stroke-width="1" />

  <!-- Razor-Sharp Minimalist White "MC" Monogram (Morris Chang & Martin Chen) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Geometric M -->
    <path d="M 24 71 L 24 29 L 40 51 L 56 29 L 56 71" />
    <!-- Concentric Interlocking C -->
    <path d="M 74 34.5 A 21 21 0 1 0 74 65.5" />
