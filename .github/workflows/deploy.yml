name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site content
        run: |
          set -e
          mkdir -p _site
          # Root website files: nojekyll marker, HTML pages, JS data, markdown docs, EPUB
          cp .nojekyll *.html *.js *.md *.epub _site/ 2>/dev/null || true
          # Episode assets, audio, design assets, and generator tools
          cp -r 03-剧集 tools 试听 设计资产 audio _site/ 2>/dev/null || true
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
