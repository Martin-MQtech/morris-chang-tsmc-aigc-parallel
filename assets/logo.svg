<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Radiant High-Luminance Gold Gradient -->
    <linearGradient id="goldGradient" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="15%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Inner Golden Sheen Gradient -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FEF08A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>

    <!-- Deep Tech Obsidian Core for crisp vector M -->
    <linearGradient id="darkMonogram" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2430" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Radiant Ambient Outer Glow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Outer Radiant Gold Circular Badge -->
  <circle cx="50" cy="50" r="47" fill="url(#goldGradient)" stroke="#78350F" stroke-width="1.2" filter="url(#badgeGlow)" />

  <!-- 2. Precision Metallic Bevel Rings (Coin Edge & Wafer Rim) -->
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="url(#sheenGrad)" stroke-width="1.2" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#78350F" stroke-width="0.8" stroke-opacity="0.45" stroke-dasharray="14 3 6 3 20 3" />

  <!-- 3. Semiconductor Cardinal Alignment Nodes (Microtech Accents) -->
  <line x1="50" y1="3" x2="50" y2="7.5" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="92.5" x2="50" y2="97" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />
  <line x1="3" y1="50" x2="7.5" y2="50" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />
  <line x1="92.5" y1="50" x2="97" y2="50" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />

  <!-- 4. High-Contrast Monolithic "M" Monogram (Obsidian Black with Architectural Angles) -->
  <path d="M21 75 L21 25 L33.5 25 L50 49.5 L66.5 25 L79 25 L79 75 L67.5 75 L67.5 42 L52.5 64.5 L47.5 64.5 L32.5 42 L32.5 75 Z"
        fill="url(#darkMonogram)"
        stroke="#05070B"
        stroke-width="0.5"
        stroke-linejoin="round" />

  <!-- 5. Internal Subtle Tech Accents inside the M -->
  <!-- Micro Light Glint along the Top-Left Peak -->
  <path d="M22.5 26.5 L32.5 26.5 L49 51 L49 48 L33.5 25 L21 25 Z" fill="#FFFFFF" fill-opacity="0.25" />

  <!-- Central Silicon Golden Node / Parallel Hub (Hexagonal Core) -->
  <polygon points="50,46.5 53.5,48.5 53.5,52.5 50,54.5 46.5,52.5 46.5,48.5" fill="#FDE047" stroke="#D97706" stroke-width="0.75" />
  <circle cx="50" cy="50.5" r="1.2" fill="#0F172A" />

  <!-- Dual Parallel Timeline Slits / Quantum Bus Lines -->
  <line x1="26.8" y1="36" x2="26.8" y2="69" stroke="#FDE047" stroke-width="1" stroke-linecap="round" opacity="0.85" />
  <line x1="73.2" y1="36" x2="73.2" y2="69" stroke="#FDE047" stroke-width="1" stroke-linecap="round" opacity="0.85" />
</svg>
