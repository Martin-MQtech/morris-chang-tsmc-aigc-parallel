<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36" fill="none">
  <!-- Circular Disc Base -->
  <circle cx="50" cy="50" r="48" fill="#0B0F17" stroke="#1E293B" stroke-width="1.8" />
  <circle cx="50" cy="50" r="43" stroke="#2A374A" stroke-width="0.8" stroke-dasharray="2 2.5" />
  
  <!-- Letter 'M' (Dominant, Larger, Crisp White Geometry, Highly Legible) -->
  <!-- Left Pillar, Center Valleys, Right Pillar -->
  <path d="M20 74 V26 L42 54 L64 26 V74" 
        stroke="#FFFFFF" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Letter 'C' (Pure Amber Gold, Placed Dynamically on the Right Flank / Side of M) -->
  <!-- Clean knockout halo to prevent visual collision with M's right leg -->
  <path d="M78 40 C67 36 56 42 56 58 C56 74 68 80 82 74" 
        stroke="#0B0F17" 
        stroke-width="13" 
        stroke-linecap="round" />
        
  <path d="M78 40 C67 36 56 42 56 58 C56 74 68 80 82 74" 
        stroke="#F59E0B" 
        stroke-width="6.5" 
        stroke-linecap="round" />

  <!-- Precision Accent Dot on Top-Right Axis -->
  <circle cx="82" cy="38" r="2.2" fill="#F59E0B" />
</svg>