<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36" fill="none">
  <!-- Circular Disc Base (Architectural Dark Slate) -->
  <circle cx="50" cy="50" r="48" fill="#0B0F17" stroke="#1E293B" stroke-width="2" />
  
  <!-- Subtle Precision Hairline Ring -->
  <circle cx="50" cy="50" r="42" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" />
  
  <!-- Letter 'M' in the Back (Pure Crisp White, Architectural Bold Geometry) -->
  <path d="M26 68 V32 L50 54 L74 32 V68" 
        stroke="#FFFFFF" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Letter 'C' in the Front (Pure Amber Gold, Dynamic Geometric Arc) -->
  <!-- Subtle dark knockout path / shadow gap to give physical layering over M -->
  <path d="M66 33 C42 22 23 37 25 57 C27 75 52 82 72 67" 
        stroke="#0B0F17" 
        stroke-width="14" 
        stroke-linecap="round" />
  
  <path d="M66 33 C42 22 23 37 25 57 C27 75 52 82 72 67" 
        stroke="#F59E0B" 
        stroke-width="7.5" 
        stroke-linecap="round" />

  <!-- Central Semiconductor Focus Dot -->
  <circle cx="50" cy="54" r="2.5" fill="#F59E0B" />
</svg>