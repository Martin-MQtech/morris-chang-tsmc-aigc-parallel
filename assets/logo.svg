<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36" fill="none">
  <!-- Circular Disc Base -->
  <circle cx="50" cy="50" r="48" fill="#0B0F17" stroke="#1E293B" stroke-width="1.8" />
  <circle cx="50" cy="50" r="44" stroke="#2A374A" stroke-width="0.8" stroke-dasharray="2 2.5" />
  
  <!-- Large Letter 'M' in the Back (Pure White, Broad, Tall, Commanding Geometry) -->
  <!-- Left Pillar (X=18), Diagonal Valleys (Peak at 20, Valley at 62), Right Pillar (X=82) -->
  <path d="M17 80 V20 L50 60 L83 20 V80" 
        stroke="#FFFFFF" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Centered Letter 'C' in the Front (Pure Amber Gold, Perfectly Centered at 50,50) -->
  <!-- Knockout Underlay to give clean vector separation where C crosses M -->
  <path d="M68 34 C46 22 28 34 28 50 C28 66 46 78 68 66" 
        stroke="#0B0F17" 
        stroke-width="13" 
        stroke-linecap="round" />
        
  <!-- Golden C Foreground Stroke -->
  <path d="M68 34 C46 22 28 34 28 50 C28 66 46 78 68 66" 
        stroke="#F59E0B" 
        stroke-width="6.5" 
        stroke-linecap="round" />

  <!-- Center Core Node -->
  <circle cx="50" cy="50" r="2.2" fill="#F59E0B" />
</svg>