<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Metallic Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>

    <!-- Parallel Timeline Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="1" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Deep Obsidian Core Radial Gradient -->
    <radialGradient id="obsidianBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161F30" />
      <stop offset="65%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#06090E" />
    </radialGradient>

    <!-- Subtle Glow Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Outer Deep Obsidian Disc -->
  <circle cx="50" cy="50" r="47.5" fill="url(#obsidianBg)" stroke="#1E293B" stroke-width="0.8" />

  <!-- 2. Semiconductor Outer Circuit Ring -->
  <circle cx="50" cy="50" r="44.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="14 3 4 3 24 4 6 3 32 4" opacity="0.85" />
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-dasharray="1 3" opacity="0.45" />

  <!-- 3. Microchip Nodes & Wafer Grid Accents -->
  <g opacity="0.55" stroke="url(#goldGrad)" stroke-width="0.8">
    <!-- 4 Cardinal Nodes -->
    <line x1="50" y1="5.5" x2="50" y2="10.5" />
    <line x1="50" y1="89.5" x2="50" y2="94.5" />
    <line x1="5.5" y1="50" x2="10.5" y2="50" />
    <line x1="89.5" y1="50" x2="94.5" y2="50" />

    <!-- 4 Diagonal Micro Marks -->
    <line x1="19" y1="19" x2="22.5" y2="22.5" />
    <line x1="81" y1="19" x2="77.5" y2="22.5" />
    <line x1="19" y1="81" x2="22.5" y2="77.5" />
    <line x1="81" y1="81" x2="77.5" y2="77.5" />
  </g>

  <!-- Micro Node Points -->
  <circle cx="50" cy="5.5" r="1.2" fill="#FDE047" />
  <circle cx="5.5" cy="50" r="1.2" fill="#F59E0B" />
  <circle cx="94.5" cy="50" r="1.2" fill="#F59E0B" />
  <circle cx="50" cy="94.5" r="1.2" fill="#38BDF8" filter="url(#cyanGlow)" />

  <!-- Horizontal Bus Leads -->
  <line x1="11" y1="50" x2="21" y2="50" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.4" />
  <circle cx="16" cy="50" r="1" fill="#FDE047" opacity="0.8" />
  <line x1="79" y1="50" x2="89" y2="50" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.4" />
  <circle cx="84" cy="50" r="1" fill="#FDE047" opacity="0.8" />

  <!-- 4. Core Icon: Architectural Geometric 'M' (Semiconductor & Dual Timelines) -->
  <!-- Main Gold Monogram -->
  <path d="M23.5 70.5 L23.5 28 L33.5 28 L50 52.5 L66.5 28 L76.5 28 L76.5 70.5 L67 70.5 L67 43.5 L52.5 65.5 L47.5 65.5 L33 43.5 L33 70.5 Z"
        fill="url(#goldGrad)"
        filter="url(#goldGlow)" />

  <!-- Left Stem Precision Inset (Highlight Accent) -->
  <path d="M26 31 L31 31 L31 67.5 L26 67.5 Z" fill="url(#goldHighlight)" opacity="0.35" />
  
  <!-- Right Stem Precision Inset -->
  <path d="M69 31 L74 31 L74 67.5 L69 67.5 Z" fill="url(#goldHighlight)" opacity="0.2" />

  <!-- Inner Dynamic Parallel Ridge Line -->
  <path d="M28.5 67 L28.5 33 L32 33 L48.5 57.5 L51.5 57.5 L68 33 L71.5 33 L71.5 67"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="0.75"
        stroke-opacity="0.65"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- 5. Parallel World Timeline Arc (Luminous Cyan #38BDF8) -->
  <!-- Ambient Glow Ribbon -->
  <path d="M16 73 C30 89 70 89 84 73"
        fill="none"
        stroke="url(#cyanGrad)"
        stroke-width="3"
        stroke-linecap="round"
        filter="url(#cyanGlow)"
        opacity="0.85" />

  <!-- Sharp Inner Timeline Vector -->
  <path d="M18 73 C32 87 68 87 82 73"
        fill="none"
        stroke="#E0F2FE"
        stroke-width="0.9"
        stroke-linecap="round" />

  <!-- Timeline Singularity Center Core Node -->
  <circle cx="50" cy="83.5" r="2.2" fill="#38BDF8" filter="url(#cyanGlow)" />
  <circle cx="50" cy="83.5" r="1.1" fill="#FFFFFF" />

  <!-- Parallel Quantum Orbital Dust -->
  <circle cx="34" cy="81.5" r="0.8" fill="#7DD3FC" opacity="0.9" />
  <circle cx="66" cy="81.5" r="0.8" fill="#7DD3FC" opacity="0.9" />
</svg>
