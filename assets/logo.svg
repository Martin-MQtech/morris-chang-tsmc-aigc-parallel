<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>
  </defs>

  <!-- Deep Solid Black Circular Emblem -->
  <circle cx="50" cy="50" r="48" fill="url(#discGrad)" stroke="#26262a" stroke-width="2" />
  
  <!-- Subtle Inner Framing Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Solid Crisp White Geometric "M" (Left & Center) -->
  <path d="M 21 72 L 21 28 L 38 54 L 54 28 L 54 72" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sweeping Crescent Amber Gold "C" (Right Wing Framing / Interlocking) -->
  <path d="M 76 33 A 19 19 0 1 0 76 67" fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round" />

  <!-- Silicon Semiconductor Precision Micro-Accent -->
  <circle cx="38" cy="54" r="2.5" fill="#F59E0B" />
</svg>
