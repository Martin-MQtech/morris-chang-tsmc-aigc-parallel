<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36" fill="none">
  <!-- Circular Disc Base -->
  <circle cx="50" cy="50" r="48" fill="#0B0F17" stroke="#1E293B" stroke-width="2" />
  <circle cx="50" cy="50" r="44" stroke="#253245" stroke-width="0.8" stroke-dasharray="2 2" />
  
  <!-- Thickened Extra-Bold Letter 'M' in the Back (Pure Crisp White, Stroke 10px, Powerful Monolith) -->
  <path d="M18 78 V22 L50 58 L82 22 V78" 
        stroke="#FFFFFF" 
        stroke-width="10.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Letter 'C' in the Front (Pure Amber Gold / Yellow, Stroke 7.5px, Centered in Foreground) -->
  <!-- Crisp Knockout separation gap (16px dark stroke) over the thick M -->
  <path d="M68 33 C44 20 26 34 26 50 C26 66 44 80 68 67" 
        stroke="#0B0F17" 
        stroke-width="16" 
        stroke-linecap="round" />
        
  <!-- Foreground Golden C -->
  <path d="M68 33 C44 20 26 34 26 50 C26 66 44 80 68 67" 
        stroke="#F59E0B" 
        stroke-width="7.5" 
        stroke-linecap="round" />

  <!-- Center Accent Node -->
  <circle cx="50" cy="50" r="2.5" fill="#F59E0B" />
</svg>